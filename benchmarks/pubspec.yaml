name: benchmarks
description: Unattended Raspberry Pi effect and media benchmarks for DSlideShow.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '^3.13.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  dslideshow_flutter:
    path: ../dslideshow_flutter
  dslideshow_backend:
    path: ../backend
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  crypto: ^3.0.7
  path: ^1.9.1
  video_player: ^2.14.1
  flutterpi_gstreamer_video_player: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  build_runner: ^2.17.1

flutter:
  config:
    enable-native-assets: true
  uses-material-design: true
  shaders:
    - shaders/radial_shared_uv_reference.frag
    - shaders/glass_reconstruction_reference.frag
  assets:
    - assets/media/
    - assets/build-info.json
