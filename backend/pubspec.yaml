name: 'dslideshow_backend'
version: 15.2.0+4
description: A sample command-line application
publish_to: none
environment:
  sdk: '^3.13.0'
dependencies:
    crypto: ^3.0.7
    http: ^1.6.0
    http_parser: ^4.1.2
    mime: ^1.0.6
    path: ^1.9.1
    shelf_web_socket: ^3.0.0
    typed_data: ^1.4.0
    web_socket_channel: ^3.0.3
    shelf_virtual_directory: ^3.0.1
    shelf_multipart: ^2.0.1
    logging: ^1.3.0
    get_it: ^9.3.0
    pub_semver: ^2.2.1
    dslideshow_common:
        path: ../common
    #googleapis: ^15.0.0
    googleapis:
        path: ../../googleapis/discoveryapis_generator/googleapis
    googleapis_auth: ^2.3.5
    #flutter_gpiod: ^0.5.1+5
    flutter_gpiod:
        path: ../../flutter_packages/packages/flutter_gpiod
    dpms:
        path: ../../flutter_packages/packages/dpms
    shelf: ^1.4.3
    shelf_router: ^1.1.5
    mqtt_client: ^10.13.0
    collection: ^1.19.1
    json_annotation: ^4.12.0
    freezed_annotation: ^3.1.0
    exif: ^3.3.0
    image: ^4.12.0
dev_dependencies:
  rpc_serializers_generator:
    path: ../rpc_serializers_generator
  # shelf_router_generator: ^1.0.2
  json_serializable: ^6.15.2
  freezed: ^4.0.3
  build_runner: ^2.17.1
  test: ^1.33.0
  fake_async: ^1.3.3
  # mockito: ^5.4.0
  # http_mock: ^1.0.0


autover:
  projects:
    backend:
      path: './'
      match_token: '_BACK_'
  targets: ["../common/lib/version.dart.template"]
