name: dslideshow_flutter
description: Flutter SlideShow
version: 14.1.0+2
publish_to: none

environment:
  sdk: '^3.13.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get_it: ^9.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: ^13.0.2

  qr_flutter: ^4.1.0
  logging: ^1.3.0
  http: ^1.6.0
  # flutterpi_gstreamer_video_player >=0.2.0 supports video_player >=2.10.0.
  video_player: ^2.14.1
  duration: ^4.0.3
  device_preview: ^3.0.0

  xterm: ^4.0.0
  dslideshow_backend: 
    path: ../backend

  dslideshow_common: 
    path: ../common

  dslideshow_i18n:
    path: ../i18n

  system_metrics_widget:
    path: ../system_metrics_widget
  freezed_annotation: ^3.1.0
  
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  flutterpi_gstreamer_video_player: ^0.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  meta: ^1.19.0
  freezed: ^4.0.3
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-native-assets: true
  uses-material-design: true
  shaders:
    - packages/dslideshow_flutter/src/effect/shaders/mosaic_mask.frag
    - packages/dslideshow_flutter/src/effect/shaders/procedural_reveal.frag
    - packages/dslideshow_flutter/src/effect/shaders/water_refraction.frag
    - packages/dslideshow_flutter/src/effect/shaders/radial_blur.frag
    - packages/dslideshow_flutter/src/effect/shaders/photo_glass.frag
    - packages/dslideshow_flutter/src/effect/shaders/photo_film_dissolve.frag
